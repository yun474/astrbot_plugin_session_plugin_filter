<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会话规则</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>会话规则</h1>
        <p class="muted">按会话管理插件权限，以及会话开关、人格、模型、知识库。一条规则可以管很多个会话。</p>
      </div>
      <div class="topbar-actions">
        <span id="dirty" class="dirty" hidden>有未保存的修改</span>
        <button id="reset" class="btn ghost" disabled>撤销</button>
        <button id="save" class="btn primary" disabled>保存</button>
      </div>
    </header>

    <section class="card settings">
      <label class="switch-row">
        <input type="checkbox" data-setting="enabled" />
        <span class="switch"></span>
        <span><b>启用规则</b><small>总开关，关闭后所有规则暂停生效</small></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" data-setting="strict" />
        <span class="switch"></span>
        <span><b>严格模式</b><small>被拦插件的事件钩子和 LLM 工具也一起屏蔽，关闭后只拦指令和消息监听</small></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" data-setting="silent_blocked_command" />
        <span class="switch"></span>
        <span><b>静默拦截指令</b><small>被屏蔽插件的指令直接吞掉，不会掉进 LLM 闲聊</small></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" data-setting="admin_bypass" />
        <span class="switch"></span>
        <span><b>管理员不受插件限制</b><small>AstrBot 管理员在任何会话都能用全部插件</small></span>
      </label>
    </section>

    <main class="layout">
      <aside class="card rules">
        <div class="section-head">
          <h2>规则</h2>
          <button id="add-rule" class="btn small">新建</button>
        </div>
        <ol id="rule-list" class="rule-list"></ol>
        <p id="rule-empty" class="empty" hidden>还没有规则，点「新建」开一条吧</p>
        <p class="hint">插件权限：命中的规则叠加生效。会话设置：精确会话优先于通配符，同级时靠前的规则优先。</p>
      </aside>

      <section id="editor" class="card editor"></section>
    </main>

    <section class="card tester">
      <div class="section-head"><h2>命中测试</h2><span class="muted">按当前（含未保存）配置预览</span></div>
      <input id="test-umo" class="input" list="session-options" placeholder="输入会话 ID，例如 aiocqhttp:GroupMessage:123456" />
      <div id="test-result" class="test-result muted"></div>
    </section>

    <section class="card migrate">
      <div class="section-head"><h2>从原生自定义规则迁移</h2></div>
      <ol class="steps">
        <li>点「导入原生规则」，把原生自定义规则里的插件、会话开关、人格、模型、知识库配置转成规则</li>
        <li>检查导入的规则，没问题就保存</li>
        <li>点「清除原生规则」，避免两边重复生效。会话备注名会保留</li>
      </ol>
      <div class="row">
        <button id="import-native" class="btn small">导入原生规则</button>
        <span id="clear-native-slot"></span>
      </div>
    </section>

    <datalist id="session-options"></datalist>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
