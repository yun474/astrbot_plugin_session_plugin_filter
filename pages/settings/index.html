<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会话插件过滤</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>会话插件过滤</h1>
        <p class="muted">按会话决定哪些插件能响应：白名单只放行勾选的插件，黑名单只屏蔽勾选的插件。</p>
      </div>
      <div class="topbar-actions">
        <span id="dirty" class="dirty" hidden>有未保存的修改</span>
        <button id="reset" class="btn ghost" disabled>撤销</button>
        <button id="save" class="btn primary" disabled>保存</button>
      </div>
    </header>

    <section class="card settings">
      <label class="switch-row">
        <input type="checkbox" data-setting="enabled" />
        <span class="switch"></span>
        <span><b>启用插件过滤</b><small>总开关，关闭后所有规则暂停生效</small></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" data-setting="silent_blocked_command" />
        <span class="switch"></span>
        <span><b>静默拦截指令</b><small>被屏蔽插件的指令直接吞掉，不会掉进 LLM 闲聊</small></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" data-setting="admin_bypass" />
        <span class="switch"></span>
        <span><b>管理员不受限制</b><small>AstrBot 管理员在任何会话都能用全部插件</small></span>
      </label>
    </section>

    <main class="layout">
      <aside class="card rules">
        <div class="section-head">
          <h2>规则</h2>
          <div class="row">
            <button id="import-native" class="btn ghost small" title="把原生自定义规则里的插件禁用配置转成黑名单规则">导入原生</button>
            <button id="add-rule" class="btn small">新建</button>
          </div>
        </div>
        <ol id="rule-list" class="rule-list"></ol>
        <p id="rule-empty" class="empty" hidden>还没有规则，点「新建」开一条吧</p>
      </aside>

      <section id="editor" class="card editor"></section>
    </main>

    <section class="card tester">
      <div class="section-head"><h2>命中测试</h2><span class="muted">按当前（含未保存）配置预览</span></div>
      <input id="test-umo" class="input" list="session-options" placeholder="输入会话 ID，例如 aiocqhttp:GroupMessage:123456" />
      <div id="test-result" class="test-result muted">输入会话 ID 看看会命中哪条规则</div>
    </section>

    <datalist id="session-options"></datalist>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
